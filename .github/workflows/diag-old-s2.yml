name: diag-old-s2

on:
  push:
    branches: [ "diag-old-esp32s2-size" ]

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "platformio==6.2.0"
      - name: Build S2
        run: |
          set +e
          PLATFORMIO_BUILD_FLAGS="-Wl,-Map=.pio/build/esp32s2/firmware.map" platformio run -e esp32s2
          rc=$?
          grep -n "diag_size\|\.bss\.espfc\|RAM:" .pio/build/esp32s2/firmware.map .pio/build/esp32s2/firmware.elf 2>/dev/null | head -n 100 || true
          echo "PLATFORMIO_RC=$rc"
          exit 0
